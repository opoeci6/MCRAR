# Copy to config/settings.toml (gitignored) to override defaults.
# Precedence: constructor args > MCRAR_* environment variables > this file > defaults.
# Relative paths are resolved against the repo root (MCRAR_HOME).

# Text-audio model for `mcrar embed` and search: clap | glap | muq-mulan (muq-mulan's weights are
# non-commercial). "clap" won the M3a bake-off; see docs/embedder_bakeoff.md. Tagging always
# reads the clap embeddings.
default_embedder = "clap"

# data_dir = "data"
# models_dir = "models"
# cache_dir = ".cache"
# secrets_dir = ".secrets"

# "file" (dev default, .secrets/secrets.toml) | "keyring" (OS credential store, needs the
# 'keyring' extra) | "env" (read-only; use MCRAR_SECRET_<NAME> variables)
secrets_backend = "file"

api_host = "127.0.0.1"
api_port = 8000

# Search and ranking (`mcrar search`). Environment: MCRAR_SEARCH__POOL_SIZE=300,
# MCRAR_SEARCH__WEIGHTS__SEMANTIC=0.5, ...
[search]
pool_size = 200        # candidates retrieved and ranked per query
max_per_artist = 2     # results per artist in one result list
min_results = 1        # fewer results than this relaxes duration, then BPM, then vocal filters

# Only the terms a query uses count (text -> semantic, genre/mood -> tags, a BPM target -> bpm,
# an energy word -> energy); the active weights are rescaled to sum to 1.
[search.weights]
semantic = 0.6
tags = 0.2
bpm = 0.1
energy = 0.1

# The optional LLM: understands a search better than the rules and can re-order the top results.
# Off by default. The API key is a secret, not a setting: `mcrar secrets set llm_api_key_<preset>`
# (or the settings page). Presets: openai, deepseek, siliconflow, zai, openrouter, gemini, groq,
# anthropic, custom (any OpenAI-compatible server, for example Ollama). Environment:
# MCRAR_LLM__ENABLED=true, MCRAR_LLM__MODEL=..., ...
[llm]
enabled = false
preset = "openai"
model = ""             # empty: the preset's default model (the "custom" preset needs one)
base_url = ""          # empty: the preset's default URL (http:// or https://)
parse_timeout_s = 10   # waiting for the LLM to read a query before falling back to the rules
rerank_timeout_s = 45  # waiting for the LLM to re-order results
rerank_top_n = 20      # results sent to the LLM to be re-ordered (5-50)
